<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>图阅读 · SpecDev 工作台</title>
<script src="/specdev-workbench/assets/theme.js"></script>
<link rel="stylesheet" href="/specdev-workbench/assets/style.css">
<!-- 把渲染器用到的 node: 内置模块映射到随包替身（vendor/archify-renderer/stubs/）。
     编译路径不该真调用它们；一旦被调用，替身抛错暴露。 -->
<script type="importmap">
{
  "imports": {
    "node:fs": "/specdev-workbench/vendor/stubs/fs.mjs",
    "node:path": "/specdev-workbench/vendor/stubs/path.mjs",
    "node:url": "/specdev-workbench/vendor/stubs/url.mjs",
    "node:crypto": "/specdev-workbench/vendor/stubs/crypto.mjs",
    "node:http": "/specdev-workbench/vendor/stubs/http.mjs",
    "node:https": "/specdev-workbench/vendor/stubs/https.mjs",
    "node:net": "/specdev-workbench/vendor/stubs/net.mjs",
    "node:dns/promises": "/specdev-workbench/vendor/stubs/dns-promises.mjs",
    "node:child_process": "/specdev-workbench/vendor/stubs/child_process.mjs"
  }
}
</script>
</head>
<body class="read-page">
<header class="app-bar">
  <a class="brand" data-home-link href="/specdev-workbench/" aria-label="SpecDev 项目首页"><span class="brand-mark" aria-hidden="true">S<span></span></span><span>SpecDev<span class="brand-caption">工作台</span></span></a>
  <div class="theme-switch" role="group" aria-label="页面主题"><button type="button" data-theme-choice="light" aria-pressed="false"><span aria-hidden="true">☼</span> 浅色</button><button type="button" data-theme-choice="dark" aria-pressed="true"><span aria-hidden="true">☾</span> 深色</button></div>
</header>
<div class="page-content">
<header class="top">
  <div>
    <p class="crumbs"><a href="/specdev-workbench/">项目首页</a> / <a id="bizLink" href="/specdev-workbench/">业务</a> / <span id="chartName">…</span></p>
    <h1 id="title">图阅读</h1>
    <p class="sub" id="summary"></p>
    <!-- 第二期第 2 步：工作区模式显示"工作区：名称（路径）"，手动配置模式注明（由 read.js 填充）。
         长路径不再直接铺开行内断词，与首页一样折进可展开块（common.js renderRepoLine 填充）。 -->
    <details class="workspace-details" id="workspaceDetails" hidden><summary id="workspaceLabel">工作区</summary><p id="repoLine"></p></details>
  </div>
  <p id="status" class="status" data-kind="info">正在读取图…</p>
</header>
<p id="errorBox" class="error" hidden></p>
<section id="guideBox" class="guide" hidden></section>
<nav id="versions" class="versions"></nav>
<!-- 正看"当前（工作区）"时的登记信息行：看历史快照时这里说明图名与摘要的来处；由 read.js 填充。 -->
<p id="snapshotMeta" class="muted" hidden></p>
<!-- 「已选」状态条（E·选中同步＋F·节点详情阅读）：显示图里当前被原生选中的步骤，
     并给一个「查看详情」入口；没有选中时整条隐藏，接不上增强阅读时在这里说明一句。 -->
<p id="selectionBar" class="selection-bar" hidden>
  <span id="selectionText"></span>
  <button id="detailOpen" class="detail-open" type="button" hidden>查看详情</button>
</p>
<div class="reader-tools"><span class="muted">双击节点查看详情，也可选中后点击“查看详情”</span><button id="materialsOpen" type="button" disabled>全部阅读资料</button></div>
<!-- 现场渲染挂载点：原生装配出的整页装在 iframe（独立小房间）里，样式自带。 -->
<main id="stage" class="chart-stage"></main>
</div>
<!-- 节点详情弹层（F）：读某个步骤在当前所选版本里的说明正文。
     关闭三方式：右上按钮 / ESC / 点框外空白；弹层不碰图，关闭后图的缩放与位置原样。 -->
<dialog id="detailDialog" class="detail-dialog" aria-label="节点详情与源码对照">
  <div class="detail-dialog-head">
    <span>节点详情</span>
    <button autofocus id="detailClose" class="detail-close" type="button" aria-label="关闭详情">×</button>
  </div>
  <div id="detailContent" class="detail-dialog-body"></div>
  <p id="detailSource" class="detail-source"></p>
</dialog>
<!-- 原底部资料移入按需打开的弹层，保留未配对资料与图渲染失败时的阅读入口。 -->
<dialog id="materialsDialog" class="detail-dialog materials-dialog" aria-label="全部阅读资料">
  <div class="detail-dialog-head"><span>全部阅读资料 · 当前所选版本</span><button autofocus id="materialsClose" class="detail-close" type="button" aria-label="关闭阅读资料">×</button></div>
  <div class="detail-dialog-body"><section id="detailsPanel" class="details-panel"></section><section id="evidencePanel" class="evidence-panel"><p>正在读取源码证据…</p></section></div>
</dialog>
<script type="module" src="/specdev-workbench/assets/read.js"></script>
<!-- 保存版本弹层（G）：给"当前（工作区）"这一份内容登记一个带名称/阶段/说明的版本。
     关闭三方式与节点详情弹层一致：右上按钮 / ESC / 点框外空白。
     打开时先问一次"现在能不能存"，并把服务端的内容摘要与页面正看的那一份对一下——
     页面旧了就提示刷新并禁用保存，绝不把没确认过的内容存下来。 -->
<dialog id="saveDialog" class="save-dialog">
  <div class="detail-dialog-head">
    <span>保存版本</span>
    <button id="saveClose" class="detail-close" type="button" aria-label="关闭保存">×</button>
  </div>
  <div class="save-dialog-body">
    <p id="saveCheck" class="save-check"></p>
    <label class="save-field">
      <span class="save-label">版本名称</span>
      <input id="saveName" type="text" maxlength="200" autocomplete="off" placeholder="例如：首版设计">
    </label>
    <fieldset class="save-field save-stages">
      <legend class="save-label">阶段</legend>
      <label><input type="radio" name="saveStage" value="design" checked> 设计版</label>
      <label><input type="radio" name="saveStage" value="implemented"> 实现版</label>
    </fieldset>
    <label class="save-field">
      <span class="save-label">保存说明（可以不填）</span>
      <textarea id="saveNote" rows="3" maxlength="1000" placeholder="这一版存下来是为了什么，或者和别人约定了什么"></textarea>
    </label>
    <p id="saveError" class="save-error" hidden></p>
    <div class="save-actions">
      <button id="saveSubmit" class="save-submit" type="button" disabled>保存</button>
      <button id="saveCancel" class="save-cancel" type="button">取消</button>
    </div>
  </div>
</dialog>
</body>
</html>
