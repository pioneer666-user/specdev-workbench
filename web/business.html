<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>业务 · SpecDev 工作台</title>
<script src="/specdev-workbench/assets/theme.js"></script>
<link rel="stylesheet" href="/specdev-workbench/assets/style.css">
<link rel="stylesheet" href="/specdev-workbench/assets/markdown.css">
<link rel="stylesheet" href="/specdev-workbench/assets/business.css">
</head>
<body class="business-page">
<div class="page-content">
<nav class="crumbs business-back" aria-label="项目导航"><a data-ws-link="/specdev-workbench/" href="/specdev-workbench/"><span aria-hidden="true">←</span> 项目首页</a></nav>
<main>
<header class="business-heading">
  <div class="business-copy"><h1 id="title">业务</h1><p id="intro" class="business-description"></p></div>
  <!-- 业务说明有效才出现，不预读房间API；图鉴沿用房间已有入口。 -->
  <div id="roomEntryLine" hidden><a id="roomEntry" class="business-room-entry" href="/specdev-workbench/room">进入房间 <span aria-hidden="true">→</span></a></div>
</header>
<p id="status" class="status" data-kind="info" role="status">正在读取业务…</p>
<p id="errorBox" class="error" hidden></p>
<section id="guideBox" class="guide" hidden></section>
<section id="docs" class="business-resources" aria-labelledby="docsHeading" hidden>
  <h2 id="docsHeading" class="business-section-heading">业务文档 <span class="business-section-count">· <span id="docsCount"></span></span></h2>
  <ul id="docList" class="business-doc-list"></ul>
  <p id="docsEmpty" class="business-empty" hidden>暂无登记文档</p>
</section>
<section id="charts" class="business-resources" aria-labelledby="chartsHeading" hidden>
  <h2 id="chartsHeading" class="business-section-heading">流程图 <span class="business-section-count">· <span id="chartsCount"></span></span></h2>
  <div id="root" class="business-chart-grid"></div>
  <p id="chartsEmpty" class="business-empty" hidden>暂无登记流程图</p>
</section>
</main>
</div>
<div id="documentReader" class="document-overlay" hidden>
  <section class="document-panel" role="dialog" aria-modal="true" aria-labelledby="documentTitle">
    <header class="document-header"><h2 id="documentTitle" data-doc-title>业务文档</h2><button type="button" data-doc-close>关闭阅读</button></header>
    <div class="document-layout"><ul class="document-list" data-doc-list aria-label="已登记文档"></ul><div class="document-content">
      <p data-doc-status role="status"></p><button type="button" data-doc-retry hidden>重试</button><div data-doc-body hidden></div>
    </div></div>
  </section>
</div>
<script type="module" src="/specdev-workbench/assets/business.js"></script>
</body>
</html>
