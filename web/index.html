<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>项目首页 · SpecDev 工作台</title>
<script src="/specdev-workbench/assets/theme.js"></script>
<link rel="stylesheet" href="/specdev-workbench/assets/style.css">
<link rel="stylesheet" href="/specdev-workbench/assets/home.css">
</head>
<body class="home-page" data-home-state="loading">
<a class="skip-link" href="#main">跳到主要内容</a>
<main id="main" class="home-main">
  <section id="projectHero" class="project-hero" aria-labelledby="projectName" hidden>
    <div class="hero-copy home-width">
      <h1 id="projectName"></h1>
      <p id="projectDesc" class="hero-description"></p>
      <div id="heroActions" hidden><a class="browse-entry" href="#businesses">浏览业务 <span aria-hidden="true">↓</span></a></div>
    </div>
  </section>
  <section id="businesses" class="business-section home-width" aria-labelledby="businessHeading" tabindex="-1">
    <h1 id="stateHeading">项目首页</h1>
    <div class="section-heading">
      <h2 id="businessHeading">业务列表</h2>
      <p id="projectMetrics" class="project-metrics" hidden>业务 <span id="businessCount">—</span> · 流程图 <span id="chartCount">—</span><span id="chartCountNote"></span></p>
    </div>
    <p id="status" class="status" data-kind="info" role="status">正在读取项目清单…</p>
    <p id="errorBox" class="error" role="alert" hidden></p>
    <section id="guideBox" class="guide" hidden></section>
    <div id="root" class="cards home-cards" aria-busy="true"><p class="loading-copy">正在整理业务入口…</p></div>
    <div class="project-context">
      <details class="workspace-details" id="workspaceDetails" hidden><summary id="workspaceLabel">工作区详情</summary><p id="repoLine"></p></details>
      <div class="project-links">
        <a id="buildingLink" class="showcase-link" data-ws-link="/specdev-workbench/building" hidden>走进建筑 <span aria-hidden="true">↗</span></a>
        <a id="showcaseLink" class="showcase-link" href="/specdev-workbench/showcase" data-ws-link="/specdev-workbench/showcase" hidden>业务展示 <span aria-hidden="true">↗</span></a>
      </div>
    </div>
  </section>
</main>
<script type="module" src="/specdev-workbench/assets/home.js"></script>
</body>
</html>
